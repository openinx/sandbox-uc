name: Unity Catalog AI Databricks Integration Tests

on:
  push:
    branches:
      - main
    paths:
      - ai/integrations/**
      - .github/workflows/ucai-integration-tests.yml
  pull_request:
    paths:
      - ai/integrations/**
      - .github/workflows/ucai-integration-tests.yml

permissions:
  contents: read

jobs:
  crewai_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group crewai
      - name: Activate virtual environment
        run: |
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/ai/.venv" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/ai/.venv/bin" >> $GITHUB_PATH
      - name: Run tests
        run: |
          uv run --no-sync pytest integrations/crewai/tests --ignore=integrations/crewai/tests/test_crewai_toolkit_oss.py

