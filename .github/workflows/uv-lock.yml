name: Update uv.lock

# Run this workflow to generate or update ai/uv.lock.
# Trigger it manually on the first setup (to bootstrap the lock file) or when
# you want to update pinned dependency versions.
on:
  workflow_dispatch:
  schedule:
    # Every Monday at 01:00 UTC
    - cron: '0 1 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Generate uv.lock
        working-directory: ai
        run: uv lock

      - name: Create pull request
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6b32b9e3be965e8f5ee # v7.0.8
        with:
          branch: auto/update-uv-lock
          title: '[CI] Update ai/uv.lock'
          commit-message: '[CI] Update ai/uv.lock'
          body: |
            Automated update of `ai/uv.lock` generated by the `uv-lock` workflow.

            Review the diff to confirm the dependency changes look expected.
          delete-branch: true
