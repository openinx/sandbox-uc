name: MLflow-UC OSS Integration Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -exo pipefail {0}

env:
  MLFLOW_HOME: /home/runner/work/mlflow/mlflow
  UC_OSS_INTEGRATION: true

jobs:
  uc-oss-integration-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10']
    timeout-minutes: 30
    permissions: {}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - name: Configure uv
        run: |
          # Exclude packages released after this date to guard against supply chain attacks
          # https://docs.astral.sh/uv/reference/environment/#uv_exclude_newer
          echo "UV_EXCLUDE_NEWER=2026-03-10T00:00:00Z" >> $GITHUB_ENV
      - name: Install dependencies
        run: |
          uv pip install --system mlflow
          uv pip install --system pytest
      - name: Start Unity Catalog Server
        run: |
          ai/dev/start_unitycatalog.sh
      - name: Run tests for UnityCatalog
        run: |
          pytest tests/test_mlflow_integration.py
      - name: Stop Unity Catalog Server
        run: |
          ai/dev/teardown_server.sh
