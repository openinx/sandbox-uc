name: UCAI Core Tests

on:
  push:
    branches:
      - main
    paths:
      - ai/**
      - .github/workflows/ucai-*.yml
  pull_request:
    paths:
      - ai/**
      - .github/workflows/ucai-*.yml

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - name: Configure uv
        run: |
          # Exclude packages released after this date to guard against supply chain attacks
          # https://docs.astral.sh/uv/reference/environment/#uv_exclude_newer
          echo "UV_EXCLUDE_NEWER=2026-03-10T00:00:00Z" >> $GITHUB_ENV
      - name: Install dependencies
        run: |
          uv pip install --system -r requirements/lint-requirements.txt
      - name: Lint Python code with ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Lint YAML files with yamllint
        run: yamllint .

  core_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10']
        pydantic-version: [1, 2]
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ai
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - name: Configure uv
        run: |
          # Exclude packages released after this date to guard against supply chain attacks
          # https://docs.astral.sh/uv/reference/environment/#uv_exclude_newer
          echo "UV_EXCLUDE_NEWER=2026-03-10T00:00:00Z" >> $GITHUB_ENV
      - name: Install Pydantic dependencies
        run: |
          if [ ${{ matrix.pydantic-version }} == 1 ]; then
            uv pip install --system 'pydantic<2'
          else
            uv pip install --system 'pydantic<3,>=2'
          fi
      - name: Install dependencies
        run: |
          uv pip install --system mlflow
      - name: Install Unity Catalog Python Libraries
        run: |
          dev/install_client.sh
      - name: Start Unity Catalog Server
        run: |
          dev/start_unitycatalog.sh
      - name: Run Tests
        run: |
          pytest core/tests --ignore=core/tests/core/databricks/test_databricks_unit_tests.py
      - name: Run Databricks Unit Tests
        if: matrix.python-version == '3.10'
        run: |
          uv pip install --system databricks-connect==15.1.0
          pytest core/tests/core/databricks/test_databricks_unit_tests.py
      - name: Stop Unity Catalog Server
        if: always()
        run: |
          dev/teardown_server.sh
