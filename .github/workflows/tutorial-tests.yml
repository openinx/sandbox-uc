name: Tutorial Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
    - name: Set up JDK 17
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      with:
        python-version: '3.8'

    - name: Install uv
      uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

    - name: Install dependencies
      env:
        # Exclude packages released after this date to guard against supply chain attacks
        # https://docs.astral.sh/uv/reference/environment/#uv_exclude_newer
        UV_EXCLUDE_NEWER: 2026-03-10T00:00:00Z
      run: |
        uv pip install --system requests
        uv pip install --system duckdb==1.0.0

    - name: Test Tutorial
      run: |
        python tests/test_tutorial.py
