name: Tutorial Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Install uv
      uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

    - name: Configure uv
      run: |
        # Exclude packages released after this date to guard against supply chain attacks
        # https://docs.astral.sh/uv/reference/environment/#uv_exclude_newer
        echo "UV_EXCLUDE_NEWER=2026-03-10T00:00:00Z" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        uv pip install --system requests
        uv pip install --system duckdb==1.0.0

    - name: Test Tutorial
      run: |
        python tests/test_tutorial.py
